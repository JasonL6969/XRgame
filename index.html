<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>故宮尋寶：搵到就聽（最小可玩版 / Quest 3S MR）</title>

  <!-- A-Frame stable release build (Quest 3 / 3S 上相容性與社群測試最成熟) -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <!-- Unicode-friendly text rendering for VR HUD -->
  <script src="https://unpkg.com/aframe-troika-text@1.0.1/dist/aframe-troika-text.min.js"></script>

  <link rel="stylesheet" href="styles/main.css" />
</head>

<body>
  <canvas id="hudCanvas" width="1024" height="512" style="display:none;"></canvas>
  <div id="overlay">
    <div id="hud">
      <div id="row">
        <div class="pill">🧭 故宮尋寶（3–4 分鐘）</div>
        <div class="pill">⏱ <span id="timer">03:30</span></div>
        <div class="pill">✅ 已搵到 <span id="found">0</span>/3</div>
      </div>
      <h1 id="title">開始：撳一下（桌機）／按 Trigger（Quest）</h1>
      <p id="msg">目標會顯示喺上面。你要喺場景入面搵到對應物品，點佢就會顯示資料＋用廣東話讀出。</p>
      <div id="hint">建議：Stationary（原地站立）最穩定，暈動風險最低。</div>
      <div id="progressBarWrap"><div id="progressBar"></div></div>
    </div>

    <div id="info"><div id="infoCard">
      <div id="infoTitle">（文物資料）</div>
      <p id="infoBody">（會喺你搵到後顯示）</p>
    </div></div>

    <div id="toast"><div id="toastText">完成！</div></div>
    <div id="crosshair" aria-hidden="true"></div>
  </div>

  <a-scene
    id="sceneRoot"
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false; alpha: true; exposure: 1.25;"
    background="transparent: true"
    xr-mode-ui="enabled: true; XRMode: ar;"
    webxr="optionalFeatures: dom-overlay, hit-test; overlayElement: #overlay;"
    vr-mode-ui="enabled: false"
  >
    <a-assets timeout="10000">
      <a-asset-item id="mdl-cabbage" src="3dModel/cabbage.glb"></a-asset-item>
      <a-asset-item id="mdl-meat" src="3dModel/meat.glb"></a-asset-item>
      <a-asset-item id="mdl-chicken" src="3dModel/chickenCup.glb"></a-asset-item>
      <a-asset-item id="mdl-fake01" src="3dModel/fake01.glb"></a-asset-item>
      <a-asset-item id="mdl-fake02" src="3dModel/fake02.glb"></a-asset-item>
      <a-asset-item id="mdl-fake03" src="3dModel/fake03.glb"></a-asset-item>
      <a-asset-item id="mdl-fake04" src="3dModel/fake04.glb"></a-asset-item>
    </a-assets>

    <a-entity id="rig">
      <a-camera position="0 1.6 0" look-controls="enabled: true"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable; far: 10; interval: 0">
        <!-- VR fallback HUD (head-locked) when DOM Overlay is unavailable -->
        <a-entity id="hud3d" position="0 -0.08 -0.85" scale="0.42 0.42 0.42" visible="false">
          <a-plane id="hud3dPanel" width="0.75" height="0.32" color="#0f172a" opacity="0.9" radius="0.04"
                   material="shader: flat; src: #hudCanvas; transparent: true"></a-plane>
          <!-- Ultimate fallback text to ensure always readable in case canvas fails -->
          <a-troika-text id="hud3dFallbackTitle" value="" color="#EAF2FF" opacity="0.95" font-size="0.06" max-width="0.7" text-align="center" position="0 0.09 0.015"></a-troika-text>
          <a-troika-text id="hud3dFallbackMsg" value="" color="#cfe1ff" opacity="0.95" font-size="0.045" max-width="0.7" text-align="center" position="0 0.02 0.015"></a-troika-text>
          <a-troika-text id="hud3dFallbackTimer" value="" color="#9dd5ff" opacity="0.95" font-size="0.04" max-width="0.7" text-align="center" position="0 -0.05 0.015"></a-troika-text>
          <!-- Invisible hit areas for buttons; labels are drawn on canvas -->
          <a-plane id="hud3dBtnPrimary" class="clickable" width="0.30" height="0.10" position="0.16 -0.12 0.012"
                   color="#10b981" opacity="0.01" radius="0.022"></a-plane>
          <a-plane id="hud3dBtnPrimaryBg" width="0.30" height="0.10" position="0.16 -0.12 0.011" color="#10b981" radius="0.022"></a-plane>
          <a-troika-text id="hud3dBtnPrimaryLabel" value="開始" font-size="0.045" color="#081018" max-width="0.28" text-align="center" position="0.16 -0.12 0.015"></a-troika-text>
          <a-plane id="hud3dBtnSecondary" class="clickable" width="0.30" height="0.10" position="-0.16 -0.12 0.012"
                   color="#1f2937" opacity="0.01" radius="0.022" visible="false"></a-plane>
          <a-plane id="hud3dBtnSecondaryBg" width="0.30" height="0.10" position="-0.16 -0.12 0.011" color="#1f2937" radius="0.022" visible="false"></a-plane>
          <a-troika-text id="hud3dBtnSecondaryLabel" value="" font-size="0.045" color="#EAF2FF" max-width="0.28" text-align="center" position="-0.16 -0.12 0.015" visible="false"></a-troika-text>
        </a-entity>
      </a-camera>
    </a-entity>

    <a-entity id="rightHand"
      laser-controls="hand: right"
      raycaster="objects: .clickable; far: 10; interval: 0"
      line="color: #7dd3fc; opacity: 0.9"
      controller-picker>
    </a-entity>

    <a-entity id="leftHand" laser-controls="hand: left" line="color: #a7f3d0; opacity: 0.65"></a-entity>

    <!-- Lights (MR-friendly) -->
    <a-entity light="type: ambient; intensity: 1.05;"></a-entity>
    <a-entity light="type: hemisphere; intensity: 0.85; color: #ffffff; groundColor: #2b3344"></a-entity>
    <a-entity light="type: directional; intensity: 0.95; color: #ffffff" position="1.2 2.6 1.0"></a-entity>
    <a-entity light="type: directional; intensity: 0.55; color: #e6f0ff" position="-1.4 1.8 -1.0"></a-entity>

    <a-entity id="huntRoot" position="0 0.15 -1.6" hunt-game>
      <a-entity id="platform" position="0 -0.25 0">
        <a-cylinder radius="0.70" height="0.06" material="color:#0b1220; opacity:0.45; transparent:true; roughness:1"></a-cylinder>
        <a-ring radius-inner="0.62" radius-outer="0.70" rotation="-90 0 0"
                material="color:#7dd3fc; opacity:0.22; transparent:true;"></a-ring>
      </a-entity>

      <a-entity id="floatingText" position="0 0.42 0">
        <a-troika-text value="開始後：搵到目標就點佢" text-align="center" color="#EAF2FF" opacity="0.92" font-size="0.08" max-width="2.6"></a-troika-text>
      </a-entity>

      <a-entity id="items"></a-entity>
    </a-entity>

    <a-circle radius="2.0" rotation="-90 0 0" position="0 0 0" material="color:#7dd3fc; opacity:0.03; transparent:true;"></a-circle>
  </a-scene>

  <script defer src="scripts/game.js"></script>
  <script>
    (function(){
      const dbg = document.createElement('div');
      dbg.id = 'debugBox';
      dbg.style = 'position:fixed;right:12px;top:12px;background:rgba(255,255,255,0.06);color:#fff;padding:8px;border-radius:8px;z-index:99999;font-size:12px;backdrop-filter:blur(6px);pointer-events:none;';
      dbg.textContent = 'Scene: initializing...';
      document.body.appendChild(dbg);
      const sceneEl = document.getElementById('sceneRoot');
      if (!sceneEl) { dbg.textContent = 'Scene: NOT FOUND'; return; }
      sceneEl.addEventListener('loaded', () => { dbg.textContent = 'Scene: loaded'; });
      sceneEl.addEventListener('renderstart', () => { dbg.textContent = 'Scene: renderstart'; dbg.style.background = 'rgba(16,185,129,0.12)'; });
      sceneEl.addEventListener('enter-vr', () => { dbg.textContent = 'Scene: enter-vr'; });
      sceneEl.addEventListener('exit-vr', () => { dbg.textContent = 'Scene: exit-vr'; });
      setTimeout(() => {
        if (!/renderstart/.test(dbg.textContent)) dbg.textContent += ' (no renderstart after 3s)';
      }, 3000);
    })();
  </script>
</body>
</html>
